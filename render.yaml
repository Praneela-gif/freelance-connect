services:
  # 1. User Service (Authentication, Profiles, Admin Delegation)
  - type: web
    name: freelance-user-service
    runtime: docker
    dockerfilePath: user-service/Dockerfile
    dockerContext: MicroserviceFreelancing
    plan: free
    healthCheckPath: /api/auth/health
    envVars:
      - key: PORT
        value: 8081
      - key: DATABASE_URL
        fromDatabase:
          name: freelance-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

  # 2. Project Service (Projects, Proposals/Bids, Milestone Deliverables)
  - type: web
    name: freelance-project-service
    runtime: docker
    dockerfilePath: project-service/Dockerfile
    dockerContext: MicroserviceFreelancing
    plan: free
    healthCheckPath: /api/projects/health
    envVars:
      - key: PORT
        value: 8082
      - key: DATABASE_URL
        fromDatabase:
          name: freelance-db
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

  # 3. React Frontend
  - type: web
    name: freelance-frontend
    runtime: static
    rootDir: ReactFreelancing
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_USER_SERVICE_URL
        fromService:
          type: web
          name: freelance-user-service
          property: host
      - key: VITE_PROJECT_SERVICE_URL
        fromService:
          type: web
          name: freelance-project-service
          property: host

databases:
  - name: freelance-db
    databaseName: freelancedb
    user: postgres
    plan: free