version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: freelance-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: freelancedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freelancedb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - freelance-net

  # 2. User Service (Authentication, Profiles, Admin Delegation)
  user-service:
    build:
      context: ./MicroserviceFreelancing
      dockerfile: user-service/Dockerfile
    container_name: freelance-user-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/freelancedb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - freelance-net

  # 3. Project Service (Projects, Proposals/Bids, Milestone Deliverables)
  project-service:
    build:
      context: ./MicroserviceFreelancing
      dockerfile: project-service/Dockerfile
    container_name: freelance-project-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/freelancedb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - freelance-net

  # 4. React Frontend (Nginx SPA + Reverse Proxy)
  frontend:
    build:
      context: ./ReactFreelancing
      dockerfile: Dockerfile
    container_name: freelance-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - user-service
      - project-service
    networks:
      - freelance-net

networks:
  freelance-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local