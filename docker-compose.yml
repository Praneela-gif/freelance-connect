version: '3.8'

services:
  # 1. Apache Kafka Broker (KRaft mode, no Zookeeper required)
  kafka:
    image: apache/kafka:3.7.0
    container_name: freelance-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - freelance-net

  # 2. User Service (Authentication, Profiles, Admin Delegation)
  user-service:
    build:
      context: ./MicroserviceFreelancing
      dockerfile: user-service/Dockerfile
    container_name: freelance-user-service
    ports:
      - "8081:8081"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVER_PORT=8081
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - freelance-net

  # 3. Project Service (Projects, Proposals/Bids, Milestone Deliverables)
  project-service:
    build:
      context: ./MicroserviceFreelancing
      dockerfile: project-service/Dockerfile
    container_name: freelance-project-service
    ports:
      - "8082:8082"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SERVER_PORT=8082
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - freelance-net

  # 4. React Frontend (Nginx SPA + Reverse Proxy)
  frontend:
    build:
      context: ./ReactFreelancing
      dockerfile: Dockerfile
    container_name: freelance-frontend
    ports:
      - "5173:80"
    depends_on:
      - user-service
      - project-service
    networks:
      - freelance-net

networks:
  freelance-net:
    driver: bridge
